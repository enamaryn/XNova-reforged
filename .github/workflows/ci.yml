name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, lint et tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xnova
          POSTGRES_PASSWORD: xnova_ci
          POSTGRES_DB: xnova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xnova -d xnova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://xnova:xnova_ci@localhost:5432/xnova_test?schema=public
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installation verrouillée sur package-lock.json
      - name: Installation (npm ci)
        run: npm ci

      # Turbo enchaîne database (prisma generate) -> game-config -> game-engine -> api et web
      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      # Les tests tournent sur le schéma issu des migrations versionnées, comme en production
      - name: Migrations de la base de test
        run: npx prisma migrate deploy
        working-directory: packages/database

      - name: Tests d'intégration
        run: npm run test:integration

  database:
    name: Migrations, sauvegarde et restauration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xnova
          POSTGRES_PASSWORD: xnova_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xnova -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: xnova_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation (npm ci)
        run: npm ci

      # pg_dump doit être au moins de la version du serveur (16)
      - name: Client PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Bases isolées (migrations et ombre)
        run: |
          psql "postgresql://xnova@localhost:5432/postgres" -c 'CREATE DATABASE xnova_migrations'
          psql "postgresql://xnova@localhost:5432/postgres" -c 'CREATE DATABASE xnova_shadow'

      - name: Migrations sur base vierge
        run: npx prisma migrate deploy
        working-directory: packages/database
        env:
          DATABASE_URL: postgresql://xnova:xnova_ci@localhost:5432/xnova_migrations?schema=public

      # Échoue si schema.prisma a changé sans migration correspondante
      - name: Aucun écart entre migrations et schema.prisma
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "postgresql://xnova:xnova_ci@localhost:5432/xnova_shadow?schema=public"
          --exit-code
        working-directory: packages/database
        env:
          DATABASE_URL: postgresql://xnova:xnova_ci@localhost:5432/xnova_migrations?schema=public

      - name: Sauvegarde, restauration, échecs et retour arrière
        run: bash scripts/test-backup-restore.sh
        env:
          TEST_PG_ADMIN_URL: postgresql://xnova:xnova_ci@localhost:5432/postgres

  e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xnova
          POSTGRES_PASSWORD: xnova_ci
          POSTGRES_DB: xnova_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xnova -d xnova_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: 'true'
      DATABASE_URL: postgresql://xnova:xnova_ci@localhost:5432/xnova_e2e?schema=public
      JWT_SECRET: e2e-secret-e2e-secret-e2e-secret
      JWT_REFRESH_SECRET: e2e-refresh-e2e-refresh-e2e-refresh
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
      # Les parcours E2E créent de nombreux comptes depuis la même IP
      RATE_LIMIT_LOGIN_MAX: '1000'
      RATE_LIMIT_REGISTER_MAX: '1000'
      RATE_LIMIT_ACCOUNT_MAX: '1000'
      # Les parcours E2E créent des comptes sans SMTP ; la confirmation obligatoire est couverte par l'intégration
      EMAIL_VERIFICATION_REQUIRED: 'false'
      # Code d'installation connu des tests (assistant SETUP-01)
      SETUP_TOKEN: E2E0-SETU-PCOD-E123

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation (npm ci)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Migrations de la base E2E
        run: npx prisma migrate deploy
        working-directory: packages/database

      # Navigateur à la version exacte de @playwright/test verrouillée dans package-lock.json
      - name: Installation de Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npm run test:e2e

      - name: Rapport Playwright (échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

  audit:
    name: Audit des dépendances de production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation (npm ci)
        run: npm ci --ignore-scripts

      # Seuil : aucune alerte haute ou critique en production (SEC-01 : 0 depuis le 4 octobre 2026).
      # Les modérées et l'outillage de développement sont suivis dans docs/NPM_AUDIT_2026-10.md.
      - name: npm audit (production, hautes et critiques)
        run: npm audit --omit=dev --audit-level=high
